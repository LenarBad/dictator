<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Dictator: волна записи и текст в Заметках">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2416"/>
      <stop offset="1" stop-color="#12110e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3e" stop-opacity=".92"/>
      <stop offset="1" stop-color="#1c1c1e" stop-opacity=".88"/>
    </linearGradient>
    <filter id="soft" x="-8%" y="-20%" width="116%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="720" height="360" rx="28" fill="url(#desk)"/>

  <!-- recording pill -->
  <g filter="url(#soft)">
    <rect x="198" y="20" width="324" height="54" rx="27" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".16"/>
    <circle cx="228" cy="47" r="5" fill="#ff3b30"/>
    <g fill="#e8b84a">
      <rect x="248" y="42" width="3.2" height="10" rx="1.4"/>
      <rect x="254" y="36" width="3.2" height="22" rx="1.4"/>
      <rect x="260" y="32" width="3.2" height="30" rx="1.4"/>
      <rect x="266" y="38" width="3.2" height="18" rx="1.4"/>
      <rect x="272" y="30" width="3.2" height="34" rx="1.4"/>
      <rect x="278" y="35" width="3.2" height="24" rx="1.4"/>
      <rect x="284" y="41" width="3.2" height="12" rx="1.4"/>
      <rect x="290" y="33" width="3.2" height="28" rx="1.4"/>
      <rect x="296" y="37" width="3.2" height="20" rx="1.4"/>
      <rect x="302" y="31" width="3.2" height="32" rx="1.4"/>
      <rect x="308" y="39" width="3.2" height="16" rx="1.4"/>
      <rect x="314" y="34" width="3.2" height="26" rx="1.4"/>
      <rect x="320" y="42" width="3.2" height="10" rx="1.4"/>
      <rect x="326" y="36" width="3.2" height="22" rx="1.4"/>
      <rect x="332" y="32" width="3.2" height="30" rx="1.4"/>
      <rect x="338" y="38" width="3.2" height="18" rx="1.4"/>
      <rect x="344" y="43" width="3.2" height="8" rx="1.4"/>
    </g>
    <text x="366" y="52" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, ui-monospace, Menlo, sans-serif" font-size="15" font-weight="600">0:12</text>
    <text x="414" y="51" fill="#98989d" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="12">⌃⇧D · стоп</text>
  </g>

  <!-- notes card -->
  <rect x="48" y="112" width="624" height="214" rx="18" fill="#1c1c1e" stroke="#ffffff" stroke-opacity=".1"/>
  <circle cx="72" cy="136" r="5" fill="#ff5f57"/>
  <circle cx="90" cy="136" r="5" fill="#febc2e"/>
  <circle cx="108" cy="136" r="5" fill="#28c840"/>
  <text x="132" y="141" fill="#8e8e93" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="12">Заметки</text>
  <text x="78" y="188" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="22" font-weight="600">Встречу переносим на пятницу.</text>
  <text x="78" y="224" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="22" font-weight="600">Подготовить черновик к обеду.</text>
  <rect x="78" y="240" width="3" height="22" fill="#e8b84a"/>
  <text x="78" y="300" fill="#8e8e93" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="13">Голос остаётся на Mac · без облака · без аккаунта</text>
</svg>
