# Build Dictator for Windows x64 and attach NSIS + zip to the GitHub Release.
#
# Cut a release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Or run this workflow manually (Actions → Release Windows) to get artifacts
# without publishing a Release. The Windows PC only installs that NSIS exe —
# no Rust/Node/VS on the test machine.
name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true

      - name: Cache GigaAM ONNX
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/gigaam
          key: gigaam-v3-2025-12-16

      - name: Cache diarization ONNX
        uses: actions/cache@v4
        with:
          path: |
            desktop/src-tauri/resources/diarize/segmentation.int8.onnx
            desktop/src-tauri/resources/diarize/embedding.onnx
          key: diarize-pyannote-3.0-int8-titanet-small

      - name: Fetch STT model
        run: bash scripts/fetch-stt-model.sh

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis --target x86_64-pc-windows-msvc

      - name: Package NSIS and zip
        run: bash scripts/package-windows.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dictator-windows-x64
          path: |
            Dictator-windows-x64.exe
            Dictator-windows-x64.zip
          if-no-files-found: error

      # Attach NSIS first so a missing zip cannot block the installer the test PC needs.
      - name: Attach NSIS to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Dictator-windows-x64.exe
          fail_on_unmatched_files: true

      - name: Attach portable zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Dictator-windows-x64.zip
          fail_on_unmatched_files: true
