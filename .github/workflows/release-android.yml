# Build Dictator Android arm64 APK and attach to the GitHub Release.
#
# Cut a release (same tag as macOS/Windows):
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# Or Actions → Release Android → Run workflow for artifacts only (no Release).
# Phone installs the APK — no Android Studio on the test device.
name: Release Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Sideload keystore properties
        working-directory: android
        run: |
          if [[ ! -f keystore.properties ]]; then
            cp keystore.properties.example keystore.properties
          fi

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name artifact
        run: |
          src="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          cp "$src" Dictator-android-arm64.apk
          ls -lh Dictator-android-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dictator-android-arm64
          path: Dictator-android-arm64.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Dictator-android-arm64.apk
          fail_on_unmatched_files: true
