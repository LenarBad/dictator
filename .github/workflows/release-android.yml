# Build Dictator Android arm64 APK and publish a separate GitHub Release.
#
# Cut an Android release (does not build Mac or Windows):
#   git tag android-vX.Y.Z && git push origin android-vX.Y.Z
#
# Or Actions → Release Android → Run workflow for artifacts only (no Release).
# Phone installs the APK — no Android Studio on the test device.
name: Release Android

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      # Default packages still include legacy `tools`, which Google removed from the
      # SDK repo ("Failed to find package 'tools'"). Install only what we need.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Cache GigaAM ONNX
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/gigaam
          key: gigaam-v3-2025-12-16

      - name: Cache diarization ONNX
        uses: actions/cache@v4
        with:
          path: |
            desktop/src-tauri/resources/diarize/segmentation.int8.onnx
            desktop/src-tauri/resources/diarize/embedding.onnx
          key: diarize-pyannote-3.0-int8-titanet-small

      - name: Fetch STT model into desktop + android assets
        run: bash scripts/fetch-stt-model.sh

      - name: Sideload keystore properties
        working-directory: android
        run: |
          if [[ ! -f keystore.properties ]]; then
            cp keystore.properties.example keystore.properties
          fi

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name artifact
        run: |
          src="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          cp "$src" Dictator-android-arm64.apk
          ls -lh Dictator-android-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dictator-android-arm64
          path: Dictator-android-arm64.apk
          if-no-files-found: error

      - name: Compose release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#android-v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          NOTE="$(git for-each-ref --format='%(contents:body)' "refs/tags/${TAG}" | sed -n '/./,$p')"
          if [[ -z "${NOTE}" ]]; then
            echo "Tag ${TAG} has no release note. Pass it as the second -m of git tag -a." >&2
            exit 1
          fi
          printf '%s\n' "${NOTE}" > /tmp/release-notes.md

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Android ${{ steps.notes.outputs.version }}
          body_path: /tmp/release-notes.md
          make_latest: "false"
          files: Dictator-android-arm64.apk
          fail_on_unmatched_files: true
