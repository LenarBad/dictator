# Build Dictator.app on Apple Silicon and attach a zip to the GitHub Release.
#
# Cut a desktop release (Mac + Windows). Android uses tag android-vX.Y.Z.
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Or run this workflow manually (Actions → Release macOS) to get an artifact
# without publishing a Release.
name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true

      - name: Cache GigaAM ONNX
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/gigaam
          key: gigaam-v3-2025-12-16

      - name: Cache diarization ONNX
        uses: actions/cache@v4
        with:
          path: |
            desktop/src-tauri/resources/diarize/segmentation.int8.onnx
            desktop/src-tauri/resources/diarize/embedding.onnx
          key: diarize-pyannote-3.0-int8-titanet-small

      - name: Fetch STT model
        run: bash scripts/fetch-stt-model.sh

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Dictator.app
        working-directory: desktop
        run: npm run tauri build -- --bundles app --target aarch64-apple-darwin

      - name: Zip .app
        run: bash scripts/package-macos-zip.sh

      - name: Compose release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # checkout replaces the annotated tag with a lightweight ref to the commit.
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          NOTE="$(git for-each-ref --format='%(contents:body)' "refs/tags/${TAG}" | sed -n '/./,$p')"
          if [[ -z "${NOTE}" ]]; then
            echo "Tag ${TAG} has no release note. Pass it as the second -m of git tag -a." >&2
            exit 1
          fi
          printf '%s\n' "${NOTE}" > /tmp/release-notes.md
          echo "wrote $(wc -l < /tmp/release-notes.md) lines"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dictator-macos-aarch64
          path: Dictator-macos-aarch64.app.zip
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Dictator-macos-aarch64.app.zip
          body_path: /tmp/release-notes.md
